name: CI

on:
  push:
    branches: ["main", "bench-*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Types & Harness Selfcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Set up uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.15

      - name: Workflow lint (actionlint, zizmor)
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint
          uvx zizmor@1.32.0 --offline .github/workflows

      - name: ShellCheck (maintained scripts)
        run: |
          uvx --from shellcheck-py==0.11.0.1 shellcheck check.sh
          # SC2164 only: the frozen EXP-2 runner uses `set -uo pipefail` without -e
          # and must not be edited. Revisit when the experiment controller replaces it.
          uvx --from shellcheck-py==0.11.0.1 shellcheck --exclude=SC2164 experiments/run_exp2.sh

      - name: Ruff Lint & Format Check
        run: |
          uvx ruff@0.17.3 check .
          uvx ruff@0.17.3 format --check .

      - name: ty Type Check
        run: uvx ty@0.0.97 check

      - name: Harness Self-Check & Runner Smoke Test
        run: uv run python bench/selfcheck.py
